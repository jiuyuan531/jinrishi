name: jinrishi
description: 今日事 —— 日常工作与生活习惯提醒（安卓 + Windows）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  http: ^1.2.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  home_widget: ^0.8.0
  android_intent_plus: ^5.3.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.1
  launch_at_startup: ^0.5.1
  windows_single_instance: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/holidays.json
    - assets/tray_icon.ico
    - assets/icon.png
