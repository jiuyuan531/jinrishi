name: 打包安卓和 Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: 代码检查
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: 规则测试
        run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: 生成安卓工程
        run: |
          flutter create --org com.shen --project-name jinrishi --platforms android .
          python3 tool/patch_platforms.py android
      - run: flutter pub get
      - name: 生成图标
        run: dart run flutter_launcher_icons -f tool/icons_android.yaml
      - name: 编译 APK
        env:
          JRS_KEY_PASSWORD: jinrishi
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: 汇总错误
        if: failure()
        run: python3 tool/report_errors.py build.log
      - name: 整理文件
        run: |
          mkdir -p dist
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "dist/jinrishi-android-${VER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: 生成 Windows 工程
        shell: bash
        run: |
          flutter create --org com.shen --project-name jinrishi --platforms windows .
          python tool/patch_platforms.py windows
      - run: flutter pub get
      - name: 生成图标
        run: dart run flutter_launcher_icons -f tool/icons_windows.yaml
      - name: 编译 exe
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.log
      - name: 汇总错误
        if: failure()
        shell: bash
        run: python tool/report_errors.py build.log
      - name: 附带 VC++ 运行库
        shell: pwsh
        run: |
          foreach ($f in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$f" "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue
          }
      - name: 制作安装程序
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          $env:APP_VERSION = $ver
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile tool\ChineseSimplified.isl
          } catch {
            (Get-Content tool\installer.iss -Encoding UTF8) -replace 'MessagesFile: "ChineseSimplified.isl"', 'MessagesFile: "compiler:Default.isl"' | Set-Content tool\installer.iss -Encoding UTF8
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" tool\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\jinrishi-windows-portable-$ver.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          TAG="v${VER}-build${{ github.run_number }}"
          gh release create "$TAG" dist/* \
            --title "今日事 ${VER}（第 ${{ github.run_number }} 次构建）" \
            --notes "手机下载 .apk 安装；电脑下载 jinrishi-setup 安装程序（或免安装 zip）。" \
            --latest
